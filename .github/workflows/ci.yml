name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (Linux + SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!' }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      HMS_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD || 'Ci-Only-Passw0rd!' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HotelManagementSystem.sln
      - run: dotnet build HotelManagementSystem.sln -c Release --no-restore
      - name: Test (everything except WPF)
        run: >-
          for p in tests/HMS.Domain.UnitTests tests/HMS.Application.UnitTests
          tests/HMS.Api.IntegrationTests tests/HMS.Infrastructure.IntegrationTests; do
          dotnet test $p -c Release --no-build --logger "trx;LogFilePrefix=$(basename $p)" || exit 1; done
      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/HMS.Infrastructure --startup-project src/HMS.Infrastructure --no-build --configuration Release
      - name: Dependency vulnerability scan
        run: dotnet list HotelManagementSystem.sln package --vulnerable --include-transitive | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

  desktop:
    name: WPF desktop tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/HMS.Desktop.Tests -c Release

  booking-web:
    name: Booking website (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
